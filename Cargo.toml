[package]
name = "psv"
version = "2.0.0"
edition = "2024"

[profile.release]
opt-level = 3
strip = true
lto = true

[dependencies]
bytemuck = "1.25.2"
eframe = { version = "0.36.2", features = ["persistence", "wgpu"] }
egui_alignments = "0.3.9"
egui_extras = "0.36.2"
egui_plot = "0.37.0"
log = "0.4.34"
libc = "0.2.191"
rand = "0.10.3"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
simple_logger = "5.2.0"
thiserror = "2.0.21"
threadpool = "1.8.1"
