[package]
name = "psv"
version = "2.0.1"
edition = "2024"

[profile.release]
opt-level = 3
strip = true
lto = true

[dependencies]
bytemuck = "1.25.2"
eframe = { version = "0.37.0", features = ["persistence", "wgpu"] }
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
egui_alignments = { git = "https://github.com/Raoul1808/egui_alignments.git", branch = "egui-0.37.0" }
egui_extras = "0.37.0"
egui_plot = "0.38.0"
log = "0.4.34"
libc = "0.2.191"
rand = "0.10.3"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
simple_logger = "5.2.0"
thiserror = "2.0.21"
threadpool = "1.8.1"
